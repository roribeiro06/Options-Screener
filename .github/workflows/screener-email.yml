name: Screener email

# Runs every 30 min during a UTC window that covers US market hours year-round.
# The Python script only actually emails 9:30-16:00 ET on weekdays; a manual
# "Run workflow" (workflow_dispatch) always sends so you can test it any time.
#
# Minutes 6/36 (not 0/30): GitHub's own docs flag the top and half of every
# hour as the highest-contention time for `schedule` triggers ("High load
# times include the start of every hour... schedule your workflow to run at
# a different time of the hour to decrease the chance of delay") -- this
# workflow went a full trading day (2026-08-28) without firing even once
# despite the cron being due every 30 min, while this repo's OTHER scheduled
# workflows fired that same day (late, but they fired) -- this is the most
# frequent cron in the repo by far, so it's the one most exposed to that
# contention. Nudging off :00/:30 both avoids the documented hot window and
# re-registers the trigger, which has also unstuck reports of scheduled runs
# that silently stopped firing.
# Still not firing reliably even off :00/:30 -- GitHub's `schedule` trigger is
# documented as best-effort and can be silently delayed or dropped, and this
# is the most frequent cron in the repo (most exposed to that). Added
# repository_dispatch as a second, independent trigger: an external cron
# service (not subject to GitHub's own scheduler contention) can POST to
# https://api.github.com/repos/roribeiro06/Options-Screener/dispatches with
# {"event_type": "screener-email-tick"} (needs a GitHub PAT with Actions
# write access, set up on the external service's side -- never store that
# token in this repo). `schedule` stays as a free-riding backup in case it
# starts working again; workflow_dispatch stays for on-demand manual runs.
on:
  schedule:
    - cron: "6,36 13-21 * * 1-5"
  workflow_dispatch:
  repository_dispatch:
    types: [screener-email-tick]

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run screener and email
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_BASE: "https://sandbox.tradier.com/v1"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python notify_email.py
