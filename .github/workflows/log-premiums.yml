name: Log observed premiums

# Snapshots what each watchlist ticker's options ACTUALLY pay (annualized bid
# yield + IV at fixed OTM levels / expirations) into premium_log/YYYY-MM.jsonl --
# the data behind the AvgPremium column. Runs shortly before the close on weekdays
# (15:45 ET in summer, 14:45 ET in winter; bids are still live). The script itself
# skips market holidays. Manually runnable: Actions -> Log observed premiums -> Run workflow.
on:
  schedule:
    - cron: "45 19 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Log even if the market looks closed (testing)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Snapshot option premiums
        env:
          SCHWAB_CLIENT_ID: ${{ secrets.SCHWAB_CLIENT_ID }}
          SCHWAB_CLIENT_SECRET: ${{ secrets.SCHWAB_CLIENT_SECRET }}
          SCHWAB_REFRESH_TOKEN: ${{ secrets.SCHWAB_REFRESH_TOKEN }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_BASE: "https://sandbox.tradier.com/v1"
          FORCE: ${{ github.event.inputs.force }}
        run: python build_premium_log.py
      - name: Commit the log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add premium_log
          git commit -m "Log observed premiums" || echo "no changes to commit"
          git pull --rebase
          git push
