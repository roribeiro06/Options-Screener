name: Early Trend email

# Targets 10:00 AM ET daily (weekdays). GitHub Actions cron is UTC-only and
# doesn't shift for US daylight saving, so this fires at both 14:06 UTC (10am
# EDT, roughly Mar-Nov) and 15:06 UTC (10am EST, roughly Nov-Mar) -- the
# script itself only actually sends on whichever tick is really ~10:00 ET,
# same "let the script decide" pattern as screener-email.yml. A manual
# "Run workflow" (workflow_dispatch) always sends so you can test it any time.
#
# Minute 6 (not 0): same reasoning as screener-email.yml's cron -- GitHub's own
# docs flag the top of every hour as the highest-contention time for `schedule`
# triggers. More importantly: `schedule` here fired exactly ONCE in this
# workflow's first 3 days (2026-08-28 creation through 2026-08-31), landing
# ~9 hours late and outside the 10:00 ET send window entirely -- the same
# "schedule silently stops firing" failure screener-email.yml already hit and
# fixed. Added repository_dispatch on the SAME "screener-email-tick" event that
# workflow's external cron service already posts every 30 min (confirmed firing
# reliably), rather than standing up a second external schedule -- this
# script's own TIME_TOLERANCE_MIN=20 window picks out the one tick near 10:00
# ET and ignores the rest, so piggybacking is safe. `schedule` stays as a
# free-riding backup in case it starts working again.
on:
  schedule:
    - cron: "6 14,15 * * 1-5"
  workflow_dispatch:
  repository_dispatch:
    types: [screener-email-tick]

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Early Trend Screener and email
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_BASE: "https://sandbox.tradier.com/v1"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EARLY_TREND_EMAIL_TO: ${{ secrets.EARLY_TREND_EMAIL_TO }}
        run: python notify_early_trend_email.py
